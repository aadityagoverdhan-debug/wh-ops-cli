[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wh-ops"
version = "1.0.0"
description = "Warehouse Operations CLI"
requires-python = ">=3.8"
dependencies = [
    "google-auth",
    "google-auth-oauthlib",
    "google-api-python-client",
    "pyyaml",
]

[project.scripts]
wh-ops = "wh_ops.cli:main"
